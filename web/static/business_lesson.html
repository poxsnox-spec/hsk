}

<script>
var params = (function() {
  var m = location.pathname.match(/\/business\/lesson\/(\d+)/);
  return { n: m ? parseInt(m[1], 10) : 1 };
})();
var data = null;
var currentTab = "text";

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c) {
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}
function has(v) { return v && typeof v === "string" && v.trim().length; }

function getTABS() {
  return [
    { id: "text",       label: t("tab_text") },
    { id: "vocab",      label: t("tab_vocab") },
    { id: "expr",       label: t("tab_expr") },
    { id: "grammar",    label: t("tab_grammar") },
    { id: "exercises",  label: t("tab_exercises") },
    { id: "workbook",   label: t("tab_workbook") },
  ];
}

// ═══════════════════════════════════════════════════════════
// Audio player helpers
// ═══════════════════════════════════════════════════════════
var _audioEls = {};

function renderAudioPlayer(audioId, src, label) {
  if (!src) return '';
  return '<div class="audio-player" style="display:flex;align-items:center;gap:8px;' +
    'padding:10px 14px;background:#e0f4f9;border-radius:10px;margin:12px 0;flex-wrap:wrap">' +
    '<button class="ap-btn ap-play" data-audio="' + audioId + '" ' +
      'style="width:38px;height:38px;border-radius:50%;border:0;background:#1a365d;color:#fff;' +
      'cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px">' +
      '<i class="fa-solid fa-play"></i></button>' +
    '<button class="ap-btn ap-rew" data-audio="' + audioId + '" ' +
      'style="padding:6px 12px;border-radius:8px;border:1px solid #1a365d;background:transparent;' +
      'color:#1a365d;cursor:pointer;font-size:12px">-5s</button>' +
    '<button class="ap-btn ap-fwd" data-audio="' + audioId + '" ' +
      'style="padding:6px 12px;border-radius:8px;border:1px solid #1a365d;background:transparent;' +
      'color:#1a365d;cursor:pointer;font-size:12px">+5s</button>' +
    '<select class="ap-speed" data-audio="' + audioId + '" ' +
      'style="padding:6px 8px;border-radius:8px;border:1px solid #cbd5e1;background:#fff;font-size:12px">' +
      '<option value="0.5">0.5×</option><option value="0.75">0.75×</option>' +
      '<option value="1.0" selected>1.0×</option><option value="1.25">1.25×</option>' +
      '<option value="1.5">1.5×</option><option value="2.0">2.0×</option></select>' +
    '<span style="font-size:12px;color:#64748b;margin-left:4px">' + (label || '') + '</span>' +
    '<audio id="' + audioId + '" preload="none" src="' + src + '"></audio>' +
    '</div>';
}

function bindAudioPlayers() {
  document.querySelectorAll(".ap-play").forEach(function(b) {
    b.addEventListener("click", function() {
      var id = b.dataset.audio;
      var a = document.getElementById(id);
      if (!a) return;
      if (a.paused) {
        // pause others
        Object.keys(_audioEls).forEach(function(k) {
          if (k !== id && !_audioEls[k].paused) _audioEls[k].pause();
        });
        a.play();
      } else a.pause();
    });
  });
  document.querySelectorAll(".ap-rew").forEach(function(b) {
    b.addEventListener("click", function() {
      var a = document.getElementById(b.dataset.audio);
      if (a) a.currentTime = Math.max(0, a.currentTime - 5);
    });
  });
  document.querySelectorAll(".ap-fwd").forEach(function(b) {
    b.addEventListener("click", function() {
      var a = document.getElementById(b.dataset.audio);
      if (a) a.currentTime = Math.min(a.duration || 1e9, a.currentTime + 5);
    });
  });
  document.querySelectorAll(".ap-speed").forEach(function(s) {
    s.addEventListener("change", function() {
      var a = document.getElementById(s.dataset.audio);
      if (a) a.playbackRate = parseFloat(s.value);
    });
  });
  // обновляем иконки play/pause
  document.querySelectorAll("audio").forEach(function(a) {
    _audioEls[a.id] = a;
    a.addEventListener("play", function() {
      var btn = document.querySelector('.ap-play[data-audio="' + a.id + '"] i');
      if (btn) btn.className = "fa-solid fa-pause";
    });
    a.addEventListener("pause", function() {
      var btn = document.querySelector('.ap-play[data-audio="' + a.id + '"] i');
      if (btn) btn.className = "fa-solid fa-play";
    });
    a.addEventListener("ended", function() {
      var btn = document.querySelector('.ap-play[data-audio="' + a.id + '"] i');
      if (btn) btn.className = "fa-solid fa-play";
    });
  });
}


function applyUI() {
  var set = function(id, key) { var el = document.getElementById(id); if (el) el.textContent = t(key); };
  set("lbl-back-mod", "back_to_modules");
  set("lbl-book-sub", "book_title");
  set("biz-info-title", "info");
  set("lbl-loading", "loading");
  set("lbl-footer-book", "book_title");
  document.title = "商务中文 · " + t("lesson");
}

function loadData() {
  fetch("/api/business/lessons/" + params.n)
    .then(function(r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function(d) { data = d; renderHeader(); renderTabs(); renderSidebar(); renderTab(); })
    .catch(function(e) {
      document.getElementById("biz-content").innerHTML =
        '<div class="text-red-500 text-center py-20">' + t("err_load") + ': ' + esc(e.message) + '</div>';
    });
}

function renderHeader() {
  var tt = data.title || {};
  document.getElementById("biz-header-title").innerHTML =
    '<span class="text-sm text-slate-400 font-normal">' +
    esc(pick(data.module_title)) + ' · ' + t("lesson") + ' ' + (data.lesson || "?") + '</span>' +
    '<div>' + esc(tt.zh || "") + ' <span class="text-slate-400 font-normal">— ' + esc(pick(tt)) + '</span></div>';

  fetch("/api/business/lessons").then(function(r) { return r.json(); }).then(function(list) {
    var nav = document.getElementById("lesson-nav");
    var html = '<div class="text-xs text-slate-400 px-3 py-2 uppercase tracking-wide">' + t("all_lessons") + '</div>';
    list.forEach(function(l) {
      var active = l.lesson === params.n;
      var titleTxt = pick(l.title) || (l.title || {}).zh || t("lesson") + " " + l.lesson;
      html += '<a href="/business/lesson/' + l.lesson + '" class="block px-3 py-2 rounded-lg text-sm ' +
        (active ? 'bg-brand-light text-brand-navy font-semibold' : 'text-slate-600 hover:bg-gray-50') + '">' +
        '<span class="text-slate-400 text-xs mr-1">' + t("lesson") + ' ' + l.lesson + '</span>' +
        esc(titleTxt) + '</a>';
    });
    nav.innerHTML = html;
  });
}

function renderTabs() {
  var tabs = document.getElementById("biz-tabs");
  var html = "";
  getTABS().forEach(function(tb) {
    var active = tb.id === currentTab;
    html += '<button class="biz-tab px-4 py-2 rounded-lg text-sm font-medium text-brand-navy whitespace-nowrap ' +
      (active ? 'active' : 'bg-white border border-gray-200') + '" data-tab="' + tb.id + '">' + tb.label + '</button>';
  });
  tabs.innerHTML = html;
  tabs.querySelectorAll(".biz-tab").forEach(function(b) {
    b.addEventListener("click", function() { currentTab = b.dataset.tab; renderTabs(); renderTab(); });
  });
}

function renderSidebar() {
  var tt = data.title || {};
  var goals = data.goals || {};
  var html = '';
  html += '<div><div class="text-xs text-slate-400 uppercase tracking-wide mb-1">' + t("title_lbl") + '</div>' +
    '<div class="text-lg font-bold text-brand-navy">' + esc(tt.zh || "") + '</div>' +
    '<div class="text-sm text-slate-500">' + esc(tt.pinyin || "") + '</div>' +
    '<div class="text-sm text-slate-600 mt-1">' + esc(pick(tt)) + '</div></div>';

  var listZh = goals.zh || [];
  var listTr = pick(goals) || [];
  if (listZh.length || (Array.isArray(listTr) && listTr.length)) {
    html += '<div class="border-t border-gray-100 pt-3"><div class="text-xs text-slate-400 uppercase tracking-wide mb-2">' + t("goals") + '</div>';
    var n = Math.max(listZh.length, (Array.isArray(listTr) ? listTr.length : 0));
    for (var i = 0; i < n; i++) {
      html += '<div class="mb-2"><div class="text-sm text-slate-700">' +
        esc(Array.isArray(listTr) ? (listTr[i] || "") : "") + '</div>' +
        '<div class="text-xs text-slate-400">' + esc(listZh[i] || "") + '</div></div>';
    }
    html += '</div>';
  }
  if (data.status === "stub") {
    html += '<div class="bg-amber-50 border border-amber-200 rounded-lg p-3 text-xs text-amber-800 mt-3">' +
      '<i class="fa-solid fa-hourglass-half mr-1"></i> ' + t("stub_note") + '</div>';
  }
  document.getElementById("biz-info").innerHTML = html;
}

function renderTab() {
  var c = document.getElementById("biz-content");
  var fns = { text: renderText, vocab: renderVocab, expr: renderExpr, grammar: renderGrammar, exercises: renderExercises, workbook: renderWorkbook };
  var fn = fns[currentTab] || renderText;
  c.innerHTML = fn();
  if (typeof bindAudioPlayers === "function") bindAudioPlayers();
}

function renderText() {
  var dlg = data.dialogs || [];
  if (!dlg.length) return '<div class="text-slate-400 text-center py-20">' + t("no_dialogs") + '</div>';
  var base = (data.audio && data.audio.base) ? data.audio.base : "/audio/business/lesson01/";
  var html = "";
  dlg.forEach(function(d, i) {
    var sc = d.scene || {};
    html += '<div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 mb-6">';
    html += '<div class="flex items-center justify-between mb-4">' +
      '<div><span class="text-xs text-slate-400 uppercase tracking-wide">' + t("dialog") + ' ' + (i+1) + '</span>' +
      '<div class="text-lg font-bold text-brand-navy">' + esc(sc.zh || "") + ' · ' + esc(pick(sc)) + '</div></div>' +
      '<button class="text-xs text-brand-cyan hover:text-brand-navy" onclick="toggleTranslations()">' +
      '<i class="fa-solid fa-eye mr-1"></i>' + t("translation_btn") + '</button></div>';
    // ── AUDIO PLAYER ──
    if (d.audio) {
      var audioId = "aud-dialog-" + i;
      var src = base + d.audio;
      html += renderAudioPlayer(audioId, src, "");
    }
    (d.lines || []).forEach(function(ln) {
      html += '<div class="dialog-line">' +
        '<div class="text-xs text-slate-400 mb-1">' + esc(ln.speaker || "") + '</div>' +
        '<div class="text-base font-medium text-slate-800">' + esc(ln.zh || "") + '</div>' +
        (has(ln.pinyin) ? '<div class="text-xs text-slate-400 mt-1 font-mono">' + esc(ln.pinyin) + '</div>' : '') +
        (pick(ln) ? '<div class="trans-block mt-1"><div class="text-sm text-slate-600">' + esc(pick(ln)) + '</div></div>' : '') +
        '</div>';
    });
    html += '</div>';
  });
  return html;
}

function renderVocab() {
  var v = data.vocabulary || [];
  if (!v.length) return '<div class="text-slate-400 text-center py-20">' + t("no_vocab") + '</div>';
  var base = (data.audio && data.audio.base) ? data.audio.base : "/audio/business/lesson01/";
  var html = '';
  if (data.audio && data.audio.vocab) {
    html += renderAudioPlayer("aud-vocab", base + data.audio.vocab, "");
  }
  html += '<div class="grid grid-cols-1 md:grid-cols-2 gap-4">';
  v.forEach(function(w) {
    html += '<div class="vocab-card bg-white rounded-xl p-5 shadow-sm border border-gray-100">' +
      '<div class="text-2xl font-bold text-brand-navy">' + esc(w.hanzi || "") +
      '<span class="text-sm text-slate-400 ml-2">' + esc(w.pinyin || "") + '</span>' +
      '<span class="text-xs text-slate-400 ml-2">' + esc(w.pos || "") + '</span></div>' +
      '<div class="text-sm text-slate-700 mt-2 mb-2">' + esc(pick(w.meaning)) + '</div>' +
      (pick(w.simple) ? '<div class="text-xs text-slate-500 bg-slate-50 rounded p-2 mb-2">' + esc(pick(w.simple)) + '</div>' : '') +
      (w.examples || []).map(function(ex) {
        return '<div class="mt-2 pt-2 border-t border-gray-100"><div class="text-sm text-slate-700">' + esc(ex.zh || "") + '</div>' +
          (pick(ex) ? '<div class="text-xs text-slate-500">' + esc(pick(ex)) + '</div>' : '') + '</div>';
      }).join("") +
      (w.question && pick(w.question) ? '<div class="mt-2 pt-2 border-t border-gray-100 text-xs text-slate-400 italic">' +
        '<i class="fa-solid fa-comment-dots mr-1"></i>' + esc(pick(w.question)) + '</div>' : '') +
      '</div>';
  });
  html += '</div>';
  return html;
}

function renderExpr() {
  var e = data.expressions || [];
  if (!e.length) return '<div class="text-slate-400 text-center py-20">' + t("no_expr") + '</div>';
  return e.map(function(x) {
    return '<div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 mb-4">' +
      '<div class="text-lg font-bold text-brand-navy mb-1">' + esc(x.zh || "") + '</div>' +
      '<div class="text-xs text-slate-400 mb-2 font-mono">' + esc(x.pinyin || "") + '</div>' +
      '<div class="text-sm text-slate-700 mb-1">' + esc(pick(x)) + '</div>' +
      (pick(x.note) ? '<div class="text-xs text-slate-500 mt-3 pt-3 border-t border-gray-100 italic">' +
        '<i class="fa-solid fa-circle-info mr-1 text-brand-cyan"></i>' + esc(pick(x.note)) + '</div>' : '') +
      '</div>';
  }).join("");
}

function renderGrammar() {
  var g = data.grammar || [];
  if (!g.length) return '<div class="text-slate-400 text-center py-20">' + t("no_grammar") + '</div>';
  return g.map(function(x) {
    return '<div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 mb-4">' +
      '<div class="text-base font-bold text-brand-navy mb-2 font-mono">' + esc(x.pattern || "") + '</div>' +
      (pick(x.explanation) ? '<div class="text-sm text-slate-700 mb-3">' + esc(pick(x.explanation)) + '</div>' : '') +
      (x.examples || []).map(function(e) {
        return '<div class="bg-slate-50 rounded-lg p-3 mb-2"><div class="text-sm text-slate-800">' + esc(e.zh || "") + '</div>' +
          (pick(e) ? '<div class="text-xs text-slate-500 mt-1">' + esc(pick(e)) + '</div>' : '') + '</div>';
      }).join("") + '</div>';
  }).join("");
}

function renderExercises() {
  var ex = data.exercises || {};
  var html = "";
  if (ex.comprehension && ex.comprehension.length) {
    html += '<div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 mb-4">' +
      '<div class="font-bold text-brand-navy mb-3">' + t("section_1") + '</div>';
    ex.comprehension.forEach(function(q, i) {
      html += '<div class="mb-4 pb-3 border-b border-gray-100">' +
        '<div class="text-sm font-medium">' + (i+1) + '. ' + esc(pick(q.q)) + '</div>' +
        '<div class="text-xs text-slate-400 mb-2 font-mono">' + esc((q.q||{}).zh || "") + '</div>' +
        '<details class="text-xs"><summary class="cursor-pointer text-brand-cyan">' + t("show_answer") + '</summary>' +
        '<div class="mt-1 text-slate-700">' + esc(pick(q.a)) + '</div></details></div>';
    });
    html += '</div>';
  }
  if (ex.true_false && ex.true_false.length) {
    html += '<div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 mb-4">' +
      '<div class="font-bold text-brand-navy mb-3">' + t("section_2") + '</div>';
    ex.true_false.forEach(function(q, i) {
      var ans = q.answer ? t("true") : t("false");
      html += '<div class="mb-3 flex items-start gap-3">' +
        '<span class="text-xs text-slate-400 mt-1">' + (i+1) + '.</span>' +
        '<div class="flex-1"><div class="text-sm">' + esc(pick(q.q)) + '</div>' +
        '<details class="text-xs mt-1"><summary class="cursor-pointer text-brand-cyan">' + t("show_answer") + '</summary>' +
        '<div class="mt-1 font-medium ' + (q.answer ? 'text-green-600' : 'text-red-500') + '">' + ans + '</div></details></div></div>';
    });
    html += '</div>';
  }
  if (ex.multiple_choice && ex.multiple_choice.length) {
    html += '<div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 mb-4">' +
      '<div class="font-bold text-brand-navy mb-3">' + t("section_3") + '</div>';
    ex.multiple_choice.forEach(function(q, i) {
      html += '<div class="mb-4 pb-3 border-b border-gray-100">' +
        '<div class="text-sm font-medium mb-2">' + (i+1) + '. ' + esc(pick(q.q)) + '</div><div class="space-y-1">';
      (q.options || []).forEach(function(opt, j) {
        var ok = j === q.answer;
        html += '<div class="text-sm ' + (ok ? 'text-green-600 font-medium' : 'text-slate-600') + '">' +
          String.fromCharCode(65+j) + '. ' + esc(opt) + (ok ? ' ✓' : '') + '</div>';
      });
      html += '</div></div>';
    });
    html += '</div>';
  }
  if (ex.fill_blank) {
    var fb = ex.fill_blank;
    html += '<div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 mb-4">' +
      '<div class="font-bold text-brand-navy mb-3">' + t("section_4") + '</div>' +
      '<div class="text-sm text-slate-700 whitespace-pre-wrap mb-4">' + esc(pick(fb.text)) + '</div>' +
      '<details><summary class="cursor-pointer text-sm text-brand-cyan">' + t("show_answer") + '</summary>' +
      '<ol class="list-decimal ml-6 mt-2 text-sm text-slate-700">' +
      (fb.answers||[]).map(function(a) { return '<li>' + esc(a.zh || "") + ' — ' + esc(pick(a)) + '</li>'; }).join("") +
      '</ol></details></div>';
  }
  return html || '<div class="text-slate-400 text-center py-20">' + t("no_exercises") + '</div>';
}

function renderWorkbook() {
  return '<div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">' +
    '<div class="text-slate-500 text-sm">' + t("no_workbook") + '</div></div>';
}

function toggleTranslations() {
  document.querySelectorAll(".trans-block").forEach(function(b) {
    b.classList.toggle("hidden-trans");
  });
}

// СТАРТ
applyUI();
loadData();
</script>
</body>
</html>
